services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Файлы верификации и др. — сохраняются при перезапуске контейнера.
      # Один раз на хосте: mkdir -p storage && chown 1001:1001 storage
      - ./storage:/app/storage
    environment:
      - NODE_ENV=production
      # В контейнере хост БД — «db». Не подставлять DATABASE_URL из .env с localhost.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tips}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL — для БД (auth, транзакции, чаевые)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tips}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Не публикуем 5432 на 0.0.0.0 — web ходит в БД по имени сервиса db:5432.
    # Админка: docker compose exec db psql -U app -d tips
    # Временно с хоста: в compose на одну сессию — "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-tips}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

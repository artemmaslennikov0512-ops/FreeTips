services:
  web:
    build: .
    restart: unless-stopped
    # Подбирает завершившиеся дочерние процессы (иначе после `node … &` возможны zombie в отчёте Docker).
    init: true
    ports:
      - "3000:3000"
    volumes:
      # Файлы верификации и др. — сохраняются при перезапуске контейнера.
      # Один раз на хосте: mkdir -p storage && chown 1001:1001 storage
      - ./storage:/app/storage
    environment:
      - NODE_ENV=production
      # В контейнере хост БД — «db». Не подставлять DATABASE_URL из .env с localhost.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-tips}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL — для БД (auth, транзакции, чаевые)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tips}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost на сервере (не 0.0.0.0) — для DBeaver через SSH-туннель.
    ports:
      - "127.0.0.1:15432:5432"
    # Web по-прежнему ходит на db:5432 по внутренней сети Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-tips}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
